[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-bridge"
version = "0.1.0"
description = "Transparent bridge uniting Herdr TUI workspaces/panes with hc (herdr-core) persistent terminals"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
hb = "herdr_bridge.cli:main"
herdr-bridge = "herdr_bridge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
